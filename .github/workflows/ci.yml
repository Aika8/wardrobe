# CI: `make test` on every push to main and every pull request — backlog rules, server tests, client tests and
# type check. The automerge workflow re-runs CI on a branch it brought up to date with main (pushes made with
# GITHUB_TOKEN start no workflow by themselves). See docs/backlog/README.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: make test
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/'
