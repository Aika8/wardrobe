# The cloud's GitHub proxy appends "Generated by Claude Code" to every PR body and comment an agent writes, and an
# agent cannot remove it (each edit goes through the same proxy). This workflow removes it with GITHUB_TOKEN, which
# does not go through the proxy. CLAUDE.md: no AI attribution in commits or PRs. Rules: scripts/backlog/backlog.py.
name: scrub-attribution

on:
  pull_request_target:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scrub:
    if: contains(github.event.pull_request.body, 'Claude Code') || contains(github.event.comment.body, 'Claude Code')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove the attribution footer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/backlog/backlog.py scrub --event "$GITHUB_EVENT_PATH"
