openapi: 3.1.0
info:
  title: Wardrobe API
  version: 0.1.0
  description: |
    The wardrobe server (ADR-0002). Contract first: a change goes here before the code; the API tests in
    app/src/test/java/wardrobe/app/ (*ApiTest) check every response body against this file.
paths:
  /items:
    get:
      operationId: listItems
      summary: All items with their card and status, optionally only those in one status
      parameters:
        - name: status
          in: query
          required: false
          description: Only items in this status. Absent, empty or blank means every item. Exact names only (`clean` is a 400).
          schema: { $ref: '#/components/schemas/ItemStatus' }
      responses:
        '200':
          description: The items, in the catalogue's order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '400':
          description: The status is not one of the four
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{id}/status:
    put:
      operationId: changeStatus
      summary: Move one item to another status
      description: |
        Allowed changes are the server's table (the item's `next`); the client shows `next` and never re-implements it.
        A refused change leaves the item as it was.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
      responses:
        '200':
          description: The item in its new status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: The body is missing, is not JSON, or its status is not one of the four
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No item has this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The item's current status may not change to the requested one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{id}/matches:
    get:
      operationId: itemMatches
      summary: Which clean items go with this item and which do not, each with the rules' reason
      description: |
        Both lists hold the CLEAN items other than the item itself, in the catalogue's order. The item itself may be in
        any status. Verdicts and reasons are the server's combination rules; the client shows them and never
        re-implements them.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: The item and its verdicts against every other clean item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matches'
        '400':
          description: The id is blank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No item has this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Item:
      type: object
      additionalProperties: false
      required: [id, name, type, colour, pattern, fabric, seasons, formality, status, next]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [TOP, BOTTOM, DRESS, OUTERWEAR, SHOES, ACCESSORY] }
        colour:
          type: string
          enum: [BLACK, WHITE, GREY, NAVY, BEIGE, BROWN, RED, PINK, ORANGE, YELLOW, GREEN, BLUE, PURPLE, UNKNOWN]
        pattern: { type: string, enum: [PLAIN, STRIPED, CHECKED, FLORAL, DOTTED, PRINTED, UNKNOWN] }
        fabric: { type: string, enum: [COTTON, LINEN, WOOL, SILK, DENIM, LEATHER, KNIT, SYNTHETIC, UNKNOWN] }
        seasons:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [WINTER, SPRING, SUMMER, AUTUMN] }
        formality: { type: string, enum: [SPORT, CASUAL, SMART_CASUAL, BUSINESS, FORMAL] }
        status:
          type: string
          enum: [CLEAN, IN_WASH, IN_REPAIR, ON_TRIP]
          description: Only CLEAN items take part in outfits.
        next:
          type: array
          uniqueItems: true
          description: The statuses this item may change to now, in the order CLEAN, IN_WASH, IN_REPAIR, ON_TRIP.
          items: { $ref: '#/components/schemas/ItemStatus' }
    ItemStatus:
      type: string
      enum: [CLEAN, IN_WASH, IN_REPAIR, ON_TRIP]
    StatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ItemStatus' }
    Match:
      type: object
      additionalProperties: false
      required: [item, reason]
      properties:
        item: { $ref: '#/components/schemas/Item' }
        reason:
          type: string
          minLength: 1
          description: Plain English for a person; when several rules refuse, every reason, joined with "; ".
    Matches:
      type: object
      additionalProperties: false
      required: [item, goes, doesNot]
      properties:
        item: { $ref: '#/components/schemas/Item' }
        goes:
          type: array
          items: { $ref: '#/components/schemas/Match' }
        doesNot:
          type: array
          items: { $ref: '#/components/schemas/Match' }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, enum: [UNKNOWN_ITEM, ILLEGAL_STATUS_CHANGE, BAD_REQUEST] }
        message: { type: string, minLength: 1, description: Plain English for a person; not for parsing. }
