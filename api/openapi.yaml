openapi: 3.1.0
info:
  title: Wardrobe API
  version: 0.1.0
  description: |
    The wardrobe server (ADR-0002). Contract first: a change goes here before the code; the API tests in
    app/src/test/java/wardrobe/app/ (*ApiTest) check every response body against this file.
paths:
  /items:
    get:
      operationId: listItems
      summary: All items with their card and status
      responses:
        '200':
          description: The items, in the catalogue's order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /items/{id}/status:
    put:
      operationId: changeStatus
      summary: Move one item to another status
      description: |
        Allowed changes are the server's table (the item's `next`); the client shows `next` and never re-implements it.
        A refused change leaves the item as it was.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
      responses:
        '200':
          description: The item in its new status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: The body is missing, is not JSON, or its status is not one of the four
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No item has this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The item's current status may not change to the requested one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Item:
      type: object
      additionalProperties: false
      required: [id, name, type, colour, pattern, fabric, seasons, formality, status, next]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [TOP, BOTTOM, DRESS, OUTERWEAR, SHOES, ACCESSORY] }
        colour:
          type: string
          enum: [BLACK, WHITE, GREY, NAVY, BEIGE, BROWN, RED, PINK, ORANGE, YELLOW, GREEN, BLUE, PURPLE, UNKNOWN]
        pattern: { type: string, enum: [PLAIN, STRIPED, CHECKED, FLORAL, DOTTED, PRINTED, UNKNOWN] }
        fabric: { type: string, enum: [COTTON, LINEN, WOOL, SILK, DENIM, LEATHER, KNIT, SYNTHETIC, UNKNOWN] }
        seasons:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [WINTER, SPRING, SUMMER, AUTUMN] }
        formality: { type: string, enum: [SPORT, CASUAL, SMART_CASUAL, BUSINESS, FORMAL] }
        status:
          type: string
          enum: [CLEAN, IN_WASH, IN_REPAIR, ON_TRIP]
          description: Only CLEAN items take part in outfits.
        next:
          type: array
          uniqueItems: true
          description: The statuses this item may change to now, in the order CLEAN, IN_WASH, IN_REPAIR, ON_TRIP.
          items: { $ref: '#/components/schemas/ItemStatus' }
    ItemStatus:
      type: string
      enum: [CLEAN, IN_WASH, IN_REPAIR, ON_TRIP]
    StatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ItemStatus' }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, enum: [UNKNOWN_ITEM, ILLEGAL_STATUS_CHANGE, BAD_REQUEST] }
        message: { type: string, minLength: 1, description: Plain English for a person; not for parsing. }
