# Maven Central answers HTTP 429 (Too Many Requests) to cloud runners that share an address (learning-exchange issue #82). Gradle retries
# 429 and 5xx by itself, but only 3 times with 1-2-4 s pauses; this gives it 8 attempts from 3 s, doubling each time.
systemProp.org.gradle.internal.network.retry.max.attempts=8
systemProp.org.gradle.internal.network.retry.initial.backOff=3000
